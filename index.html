const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function buka(sandi){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(sandi),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(pt);
}
function tampil(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f"),s=document.getElementById("s"),b=document.getElementById("b"),e=document.getElementById("e");
f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;e.textContent="";b.textContent="Membuka…";
  try{const h=await buka(s.value);try{sessionStorage.setItem("bg_s",s.value)}catch(_){}tampil(h)}
  catch(_){e.textContent="Sandi salah. Coba lagi.";b.disabled=false;b.textContent="Masuk";s.select()}};
(async()=>{let t=null;try{t=sessionStorage.getItem("bg_s")}catch(_){}if(t){try{tampil(await buka(t))}catch(_){try{sessionStorage.removeItem("bg_s")}catch(_){}}}})();
